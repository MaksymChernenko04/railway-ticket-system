
# Common

spring.application.name=railway-ticket-system
spring.main.banner-mode=off
spring.config.import=optional:file:.env[.properties]

# Logging
logging.charset.console=UTF-8
logging.charset.file=UTF-8

# Datasource

spring.datasource.url=${DATASOURCE_URL}
spring.datasource.username=${DATASOURCE_USERNAME}
spring.datasource.password=${DATASOURCE_PASSWORD}

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000
jwt.refresh-expiration=604800000

# Frontend
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}

# AI assistant
app.ai.google-api-key=${GOOGLE_AI_API_KEY:}
app.ai.model=${GOOGLE_AI_MODEL:gemini-3.1-flash-lite}
app.ai.client-chat.max-output-tokens=${CLIENT_CHAT_MAX_OUTPUT_TOKENS:1400}
app.ai.admin-chat.max-output-tokens=${ADMIN_CHAT_MAX_OUTPUT_TOKENS:2200}
